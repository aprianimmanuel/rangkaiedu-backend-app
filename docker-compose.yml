services:
  # PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: rangkai-edu-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT}:5432"
    networks:
      - rangkai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service
  backend:
    build: .
    container_name: rangkai-edu-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_TEST_NAME: ${DB_TEST_NAME}
      BACKEND_PORT: ${BACKEND_PORT}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: disable
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      OSS_REGION: ${OSS_REGION}
      OSS_ENDPOINT: ${OSS_ENDPOINT}
    ports:
      - "${BACKEND_PORT}:8080"
    networks:
      - rangkai-network
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Test Service
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: rangkai-edu-test
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_TEST_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: disable
      BACKEND_PORT: ${BACKEND_PORT}
    networks:
      - rangkai-network
    depends_on:
      db:
        condition: service_healthy

  # Frontend Service
  frontend:
    build: ../frontend-app
    container_name: rangkai-edu-frontend
    restart: unless-stopped
    environment:
      VITE_BACKEND_URL: http://backend:8080/api
      VITE_APP_ENV: development
    ports:
      - "3000:80"
    networks:
      - rangkai-network
    depends_on:
      - backend
    volumes:
      - ../frontend-app:/app
      # For development, we can mount the source code to allow hot reloading
      # In production, we would use the built assets directly

# Volumes for persistent data
volumes:
  postgres_data:
    driver: local

# Networks for service communication
networks:
  rangkai-network:
    driver: bridge